name: auto_em_dia
description: "Auto em Dia - Seu carro cuidado, sem esquecer de nada."
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado
  flutter_riverpod: ^3.4.2

  # Navegação
  go_router: ^17.4.0

  # Backend / Banco de dados / Auth (Firebase — gratuito)
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7

  # Firebase core
  firebase_core: ^4.13.0
  firebase_analytics: ^12.4.6
  firebase_crashlytics: ^5.2.7
  firebase_messaging: ^16.5.0

  # Monetização
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.0

  # Login social
  google_sign_in: ^7.2.0

  # Notificações locais
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  # uuid para geração de IDs locais (manutenções, lembretes)
  uuid: ^4.6.0

  # Gráficos
  fl_chart: ^1.2.0

  # Utilidades
  google_fonts: ^6.2.1
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  unity_ads_plugin: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
